# act --artifact-server-path $(pwd)/.artifacts

name: CI

on:
  push:
    branches:
      - '*'
    paths-ignore:
      - '**.md'
      - '**.gitkeep'
      - '**.gitignore'
  pull_request:
  workflow_dispatch:

jobs:
  build-ps2:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest
    steps:
      - run: |
          apk add build-base cmake ccache git linux-headers python3 wine jq

      - if: ${{ env.ACT }} # https://github.com/nektos/act/issues/973
        run: |
          apk add nodejs

      - uses: actions/checkout@v5
        with:
          submodules: 'recursive'

      - run: |
          export WINEPREFIX=${{ github.workspace }}/build/wine
          mkdir --parents $WINEPREFIX
          cmake -B build -DBUILD_PS2=1 -DBUILD_ARM=0 -DBOARD=waveshare-rp2040-tiny
          cmake --build build -j$(nproc)

      - uses: actions/upload-artifact@v5
        with:
          name: build-ps2
          path: |
            build/fruitchip-fw-apps-prefix/src/fruitchip-fw-apps-build/*.uf2
            build/fruitchip-test-ps2-prefix/src/fruitchip-test-ps2-build/fruitchip-test-ps2-packed.elf
            build/fwfs/*
            build/loader/*
            build/menu/*

  build-arm:
    needs: build-ps2
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - run: |
          sudo apt update && sudo apt install -y build-essential make cmake

      - uses: actions/checkout@v5
        with:
          submodules: 'recursive'

      - run: |
          wget "https://github.com/arm/arm-toolchain/releases/download/release-20.1.0-ATfE/ATfE-20.1.0-Linux-x86_64.tar.xz"
          tar --extract --directory=/opt --file ATfE-20.1.0-Linux-x86_64.tar.xz

      - run: |
          export PATH=/opt/ATfE-20.1.0-Linux-x86_64/bin:$PATH
          cmake -B build -DBUILD_PS2=0 -DBUILD_ARM=1 -DBOARD=waveshare-rp2040-tiny

      - uses: actions/download-artifact@v4
        with:
          name: build-ps2
          path: build

      - run: |
          export PATH=/opt/ATfE-20.1.0-Linux-x86_64/bin:$PATH
          cmake --build build -j$(nproc)

      - uses: actions/upload-artifact@v4
        with:
          name: build-arm
          path: |
            build/fruitchip-fw-bootloader-prefix/src/fruitchip-fw-bootloader-build/*.uf2
            build/fruitchip-fw-prefix/src/fruitchip-fw-build/*.uf2

      - run: |
          mkdir release

          git_rev () {
            GIT_REV="$(git log --pretty=format:'%h' -n 1 $1)$(git diff --quiet --exit-code -- $1 || echo '+')"
          }

          git_rev fruitchip-fw
          mv "build/fruitchip-fw-prefix/src/fruitchip-fw-build/fruitchip-fw.uf2" \
             "release/fruitchip-fw-${GIT_REV}-tiny.uf2"

          git_rev fruitchip-fw-bootloader
          mv "build/fruitchip-fw-bootloader-prefix/src/fruitchip-fw-bootloader-build/fruitchip-fw-bootloader.uf2" \
             "release/fruitchip-fw-bootloader-${GIT_REV}-tiny.uf2"

          GIT_REV="$(git log --pretty=format:'%h' -n 1 fruitchip-fw-apps)"
          mv "build/fruitchip-fw-apps-prefix/src/fruitchip-fw-apps-build/apps.uf2" \
             "release/fruitchip-apps-${GIT_REV}.uf2"

          git_rev fruitchip-menu
          mv "build/menu/fruitchip-menu-packed.elf" \
             "release/fruitchip-menu-${GIT_REV}.elf"

          git_rev fruitchip-test-ps2
          mv "build/fruitchip-test-ps2-prefix/src/fruitchip-test-ps2-build/fruitchip-test-ps2-packed.elf" \
             "release/fruitchip-test-ps2-${GIT_REV}.elf"

      - uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master'
        with:
          prerelease: true
          tag_name: latest
          files: release/*
